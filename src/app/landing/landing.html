<div class="landing-wrapper" id="widthtograb" ng-cloak>
  <div ng-class="{ 'debug-on': debugMode }">
    <div class="parallax" du-scroll-container>
      <div class="parallax-group" id="group1">
        <div class="parallax-layer parallax-layer--fore">
          <div class="landing-content">
            <div class="navboi" role="navigation">
              <div class="flexyboi titleboi" ng-class="{'stack': screenWidth < 500}">
                <div style="display:flex; align-items: center" ng-class="{'stack': screenWidth < 500}">
                  <span class="nonethatpadding">
                    <a class="thisname" href="#" style="color: white !important; text-decoration: none; display: flex;">Statements</a>
                    <div>
                      <a href="#" style="color: white !important; text-decoration: none; display: flex;" class="valueprop nonethatpositioning">
                        <div ng-class="{'largervalueprop': screenWidth < 500}" style="text-align: center">Write by Chat</div>
                      </a>
                    </div>
                  </span>
                </div>
              </div>
            </div>

            <video id="exampleAuthor" autoplay muted loop preload="none" poster="/assets/images/video-poster.jpg">
              <source src="/assets/movies/AISafety.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>

            <div class="disclaimer" style="color: white !important;" ng-if="screenWidth < 500">
              <div>(Designed for Desktop)</div>
              <span>Rapid Word Processing for Smartphone Coming Soon</span>
            </div>

            <div id="chromeOnlyElement" style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
              <div class="icon">
                <div class="arrow"></div>
              </div>

              <button class="guest-button-wrapper btn btn-lg btn-default btn-block"
                      ng-if="screenWidth > 500"
                      ng-click="screenWidth > 500 ? [joinAsGuest($event), safety = true] : inputs.nothing"
                      type="button">
                <span ng-if="!loggingIn && screenWidth > 500">Start Writing (beta)</span>
                <span ng-if="loggingIn && screenWidth > 500"><i class="fa fa-spinner fa-spin"></i>&nbsp;(Loading)</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
